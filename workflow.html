<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Workflow - Multi Bundle</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0c0f;--card:#14151a;--line:#25262d;--mut:#8f919b;--red:#f01424;--green:#2fd27a;--txt:#fff}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}
body{background:radial-gradient(120% 50% at 0% 0%,rgba(240,20,36,.16),transparent 60%),var(--bg);background-attachment:fixed}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:rgba(11,12,15,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.top b{font-size:16px;letter-spacing:.3px}
.top span{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--red)}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.pn{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.pr{font-size:12px;color:var(--mut);overflow-wrap:anywhere;margin:3px 0 22px}
.notice{border:1px solid #5a1a20;background:#2a0f13;color:#ffb3b9;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:16px}
.wf{display:flex;align-items:center;gap:14px;width:100%;padding:20px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:#fff;font-family:inherit;text-align:left;cursor:pointer;margin-bottom:14px}
.wf:active{transform:scale(.99)}
.wf:disabled{opacity:.55}
.wf .tx{flex:1;min-width:0}
.wf b{display:block;font-size:18px}
.wf small{display:block;font-size:12px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.wf .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:8px}
.wf .st i{width:8px;height:8px;border-radius:50%;background:#555761;flex:none}
.wf .st.ok i{background:var(--green)}
.wf .st.go i{background:#f5b942}
.wf .st.bad{color:#ff8a93}
.wf .st.bad i{background:var(--red)}
.wf .ch{font-size:26px;color:var(--red);font-weight:800}
.hint{font-size:12px;line-height:1.6;color:var(--mut);margin:6px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);transform:translateX(-50%);background:#23242b;border:1px solid #34353d;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:20;max-width:90%;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><button id="backBtn" aria-label="Back">&#8249;</button><b>Workflow</b><span>GITHUB</span></div>
<section class="wrap">
  <div class="pn" id="pName">Project</div>
  <div class="pr" id="pRepo"></div>
  <div class="notice" id="notice" hidden></div>

  <button class="wf" id="bApk">
    <div class="tx"><b>APK workflow</b><small>build-apk.yml &middot; install and test on a phone</small><div class="st" id="stApk"><i></i><span>Checking...</span></div></div>
    <div class="ch">&#8250;</div>
  </button>

  <button class="wf" id="bAab">
    <div class="tx"><b>AAB workflow</b><small>build-aab.yml &middot; Google Play upload</small><div class="st" id="stAab"><i></i><span>Checking...</span></div></div>
    <div class="ch">&#8250;</div>
  </button>

  <p class="hint">Tap one to add its workflow file to your GitHub repo. APK opens Build APK. AAB opens Publish Store.</p>
</section>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
'use strict';
var YML_APK="name: Build APK\non:\n  workflow_dispatch:\n    inputs:\n      app_name:\n        description: App name\n        required: true\n        default: App\n      app_id:\n        description: Package ID\n        required: true\n        default: com.example.app\n      version:\n        description: Version\n        required: true\n        default: 1.0.0\npermissions:\n  contents: write\njobs:\n  apk:\n    runs-on: ubuntu-latest\n    env:\n      APP_NAME: ${{ inputs.app_name }}\n      APP_ID: ${{ inputs.app_id }}\n      VERSION: ${{ inputs.version }}\n      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}\n      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: 21\n      - name: Prepare web files\n        run: |\n          mkdir -p \"$RUNNER_TEMP/www\"\n          if [ -f package.json ] && grep -q '\"build\"' package.json; then\n            npm install\n            npm run build\n            if [ -d dist ]; then cp -r dist/. \"$RUNNER_TEMP/www/\"; else cp -r build/. \"$RUNNER_TEMP/www/\"; fi\n          else\n            tar --exclude=.git --exclude=.github -cf - . | tar -xf - -C \"$RUNNER_TEMP/www\"\n          fi\n      - name: Create Android project\n        run: |\n          mkdir \"$RUNNER_TEMP/cap\"\n          cd \"$RUNNER_TEMP/cap\"\n          npm init -y\n          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8\n          mv \"$RUNNER_TEMP/www\" www\n          npx cap init \"$APP_NAME\" \"$APP_ID\" --web-dir www\n          npx cap add android\n          if [ -f \"$GITHUB_WORKSPACE/FolderAccessPlugin.java\" ]; then\n            PKG_DIR=\"android/app/src/main/java/$(echo \"$APP_ID\" | tr . /)\"\n            mkdir -p \"$PKG_DIR\"\n            sed \"s/^package .*/package $APP_ID;/\" \"$GITHUB_WORKSPACE/FolderAccessPlugin.java\" > \"$PKG_DIR/FolderAccessPlugin.java\"\n            printf '%s\\n' \"package $APP_ID;\" \"\" \"import android.os.Bundle;\" \"import com.getcapacitor.BridgeActivity;\" \"\" \"public class MainActivity extends BridgeActivity {\" \"    @Override\" \"    public void onCreate(Bundle savedInstanceState) {\" \"        registerPlugin(FolderAccessPlugin.class);\" \"        super.onCreate(savedInstanceState);\" \"    }\" \"}\" > \"$PKG_DIR/MainActivity.java\"\n          fi\n          npx cap sync android\n          sed -i \"s/versionName \\\".*\\\"/versionName \\\"$VERSION\\\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/\" android/app/build.gradle\n      - name: Build debug APK\n        run: |\n          cd \"$RUNNER_TEMP/cap/android\"\n          chmod +x gradlew\n          ./gradlew assembleDebug\n      - name: Publish release\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          cp \"$RUNNER_TEMP/cap/android/app/build/outputs/apk/debug/app-debug.apk\" \"$RUNNER_TEMP/app.apk\"\n          gh release create \"apk-${{ github.run_number }}\" \"$RUNNER_TEMP/app.apk\" --title \"APK build ${{ github.run_number }}\" --notes \"$APP_NAME $VERSION\" --target \"$GITHUB_SHA\"\n";
var YML_AAB="name: Build AAB\non:\n  workflow_dispatch:\n    inputs:\n      app_name:\n        description: App name\n        required: true\n        default: App\n      app_id:\n        description: Package ID\n        required: true\n        default: com.example.app\n      version:\n        description: Version\n        required: true\n        default: 1.0.0\npermissions:\n  contents: write\njobs:\n  android:\n    runs-on: ubuntu-latest\n    env:\n      APP_NAME: ${{ inputs.app_name }}\n      APP_ID: ${{ inputs.app_id }}\n      VERSION: ${{ inputs.version }}\n      GH_TOKEN: ${{ github.token }}\n      GH_REPO: ${{ github.repository }}\n      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}\n      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: 21\n      - name: Prepare web files\n        run: |\n          mkdir -p \"$RUNNER_TEMP/www\"\n          if [ -f package.json ] && grep -q '\"build\"' package.json; then\n            npm install\n            npm run build\n            if [ -d dist ]; then cp -r dist/. \"$RUNNER_TEMP/www/\"; else cp -r build/. \"$RUNNER_TEMP/www/\"; fi\n          else\n            tar --exclude=.git --exclude=.github -cf - . | tar -xf - -C \"$RUNNER_TEMP/www\"\n          fi\n      - name: Create Android project\n        run: |\n          mkdir \"$RUNNER_TEMP/cap\"\n          cd \"$RUNNER_TEMP/cap\"\n          npm init -y\n          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8\n          mv \"$RUNNER_TEMP/www\" www\n          npx cap init \"$APP_NAME\" \"$APP_ID\" --web-dir www\n          npx cap add android\n          if [ -f \"$GITHUB_WORKSPACE/FolderAccessPlugin.java\" ]; then\n            PKG_DIR=\"android/app/src/main/java/$(echo \"$APP_ID\" | tr . /)\"\n            mkdir -p \"$PKG_DIR\"\n            sed \"s/^package .*/package $APP_ID;/\" \"$GITHUB_WORKSPACE/FolderAccessPlugin.java\" > \"$PKG_DIR/FolderAccessPlugin.java\"\n            printf '%s\\n' \"package $APP_ID;\" \"\" \"import android.os.Bundle;\" \"import com.getcapacitor.BridgeActivity;\" \"\" \"public class MainActivity extends BridgeActivity {\" \"    @Override\" \"    public void onCreate(Bundle savedInstanceState) {\" \"        registerPlugin(FolderAccessPlugin.class);\" \"        super.onCreate(savedInstanceState);\" \"    }\" \"}\" > \"$PKG_DIR/MainActivity.java\"\n          fi\n          npx cap sync android\n          sed -i \"s/versionName \\\".*\\\"/versionName \\\"$VERSION\\\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/\" android/app/build.gradle\n      - name: Get or create upload key\n        run: |\n          mkdir -p \"$RUNNER_TEMP/ks\"\n          cd \"$RUNNER_TEMP/ks\"\n          REPO=\"${{ github.repository }}\"\n          NAME=\"Upload key ($APP_ID)\"\n          REL=$(gh api \"repos/$REPO/releases?per_page=100\" --jq \".[] | select(.draft and .name==\\\"$NAME\\\") | .id\" | head -1)\n          if [ -n \"$REL\" ]; then\n            echo \"Using saved upload key\"\n            for F in signing.keystore key-password.txt; do\n              AID=$(gh api \"repos/$REPO/releases/$REL\" --jq \".assets[] | select(.name==\\\"$F\\\") | .id\")\n              gh api -H \"Accept: application/octet-stream\" \"repos/$REPO/releases/assets/$AID\" > \"$F\"\n            done\n          else\n            echo \"Creating a new upload key\"\n            openssl rand -hex 16 > key-password.txt\n            keytool -genkeypair -v -keystore signing.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass \"$(cat key-password.txt)\" -keypass \"$(cat key-password.txt)\" -dname \"CN=$APP_NAME, O=$APP_NAME, C=US\"\n            gh release create \"upload-key-$APP_ID\" signing.keystore key-password.txt --draft --title \"$NAME\" --notes \"Private signing key for $APP_ID. Keep this draft. Do not publish it.\" --target \"$GITHUB_SHA\"\n          fi\n          echo \"KS_FILE=$RUNNER_TEMP/ks/signing.keystore\" >> \"$GITHUB_ENV\"\n          echo \"KS_PASS=$(cat key-password.txt)\" >> \"$GITHUB_ENV\"\n      - name: Add signing to Gradle\n        run: |\n          cd \"$RUNNER_TEMP/cap/android\"\n          python3 - <<'PY'\n          import re\n          p='app/build.gradle'\n          s=open(p).read()\n          sc=\"    signingConfigs {\\n        release {\\n            storeFile file(System.getenv('KS_FILE'))\\n            storePassword System.getenv('KS_PASS')\\n            keyAlias 'upload'\\n            keyPassword System.getenv('KS_PASS')\\n        }\\n    }\\n\"\n          s=s.replace(\"    buildTypes {\", sc+\"    buildTypes {\",1)\n          s=re.sub(r'(buildTypes\\s*\\{\\s*release\\s*\\{)', r'\\1\\n            signingConfig signingConfigs.release', s, count=1)\n          open(p,'w').write(s)\n          PY\n          grep -n \"signingConfig\" app/build.gradle\n      - name: Build AAB\n        run: |\n          cd \"$RUNNER_TEMP/cap/android\"\n          chmod +x gradlew\n          ./gradlew bundleRelease\n      - name: Make store files\n        run: |\n          OUT=\"$RUNNER_TEMP/out\"\n          mkdir -p \"$OUT\"\n          cp \"$RUNNER_TEMP/cap/android/app/build/outputs/bundle/release/app-release.aab\" \"$OUT/app.aab\"\n          FP=$(keytool -list -v -keystore \"$KS_FILE\" -alias upload -storepass \"$KS_PASS\" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//')\n          cat > \"$OUT/assetlinks.json\" <<EOF\n          [{\n            \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n            \"target\": {\n              \"namespace\": \"android_app\",\n              \"package_name\": \"$APP_ID\",\n              \"sha256_cert_fingerprints\": [\"$FP\"]\n            }\n          }]\n          EOF\n          cat > \"$OUT/readme.html\" <<EOF\n          <!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>$APP_NAME release files<\/title>\n          <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;line-height:1.6;color:#111}code{background:#eee;padding:2px 6px;border-radius:6px;word-break:break-all}<\/style><\/head><body>\n          <h1>$APP_NAME $VERSION<\/h1>\n          <p>Package ID: <code>$APP_ID<\/code><\/p>\n          <h2>Files<\/h2>\n          <ul>\n          <li><b>app.aab<\/b>: the signed bundle you upload to Google Play.<\/li>\n          <li><b>signing.keystore<\/b>: your upload key. Keep it safe and never share it. Alias: <code>upload<\/code>. The password is in <b>key-password.txt<\/b>. Both are saved in the private draft release named Upload key ($APP_ID) in this repo. Do not delete or publish that draft.<\/li>\n          <li><b>assetlinks.json<\/b>: for app links. Host it at <code>https://your-domain/.well-known/assetlinks.json<\/code>.<\/li>\n          <\/ul>\n          <h2>Upload to Google Play<\/h2>\n          <ol>\n          <li>Open Play Console, create your app, then go to Production (or Internal testing) and create a release.<\/li>\n          <li>Turn on Play App Signing when asked, then upload <b>app.aab<\/b>.<\/li>\n          <li>Fill in the store listing: icon 512x512, feature graphic 1024x500, at least 2 screenshots, descriptions, privacy policy URL, content rating and data safety form.<\/li>\n          <\/ol>\n          <h2>Fingerprint<\/h2>\n          <p>Upload key SHA-256: <code>$FP<\/code><\/p>\n          <p>Once Play App Signing is on, Google signs the app you install from the store with its own key. If you use app links, put the SHA-256 shown in Play Console under App integrity into assetlinks.json as well.<\/p>\n          <\/body><\/html>\n          EOF\n      - name: Publish release\n        run: |\n          OUT=\"$RUNNER_TEMP/out\"\n          gh release create \"aab-${{ github.run_number }}\" \"$OUT/app.aab\" \"$OUT/assetlinks.json\" \"$OUT/readme.html\" --title \"AAB build ${{ github.run_number }}\" --notes \"$APP_NAME $VERSION\" --target \"$GITHUB_SHA\"\n";
var W={
  apk:{file:'build-apk.yml',yml:YML_APK,btn:'bApk',st:'stApk',page:'apkbuild.html'},
  aab:{file:'build-aab.yml',yml:YML_AAB,btn:'bAab',st:'stAab',page:'store-android.html'}
};
function $(id){return document.getElementById(id)}
function tk(){try{return sessionStorage.getItem('mb_apk_tk')||localStorage.getItem('mb_apk_tk')||localStorage.getItem('mb_gh_active_token')||''}catch(e){return ''}}
function toast(t){var el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},3000)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function b64u(s){return btoa(unescape(encodeURIComponent(s)))}
function fromB64u(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
async function gh(method,path,body){
  var r=await fetch('https://api.github.com'+path,{method:method,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tk(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  var d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){var er=new Error((d&&d.message)||('HTTP '+r.status));er.status=r.status;throw er}
  return d;
}
var q=new URLSearchParams(location.search);
var p={id:q.get('pid')||'',name:q.get('name')||'App',repo:q.get('repo')||'',branch:q.get('branch')||'main'};
var okTk=!!tk(),okRepo=!!p.repo,busy=false;
$('pName').textContent=p.name;
$('pRepo').textContent=p.repo||'No GitHub repo';
if(!okRepo||!okTk){
  var n=$('notice');n.hidden=false;
  n.textContent=!okRepo?'Open this page from the app menu with a project open. The project must be published to GitHub first (Publish tab).':'GitHub is not connected. Go back, sign in on the GitHub tab, then open Workflow again.';
}
function setSt(k,cls,txt){var s=$(W[k].st);s.className='st '+cls;s.querySelector('span').textContent=txt}
function path(k){return '.github/workflows/'+W[k].file}
async function getCur(k){
  try{return await gh('GET','/repos/'+p.repo+'/contents/'+path(k)+'?ref='+encodeURIComponent(p.branch))}
  catch(e){if(e.status===404)return null;throw e}
}
function isSame(cur,k){try{return !!(cur&&cur.content&&fromB64u(cur.content)===W[k].yml)}catch(e){return false}}
async function check(){
  if(!okRepo||!okTk){['apk','aab'].forEach(function(k){setSt(k,'bad','Not available')});return}
  for(var k of ['apk','aab']){
    try{var cur=await getCur(k);setSt(k,cur?'ok':'',cur?'On GitHub':'Not on GitHub yet')}
    catch(e){setSt(k,'bad','Could not check')}
  }
}
function go(k){
  location.href=W[k].page+'?pid='+encodeURIComponent(p.id)+'&name='+encodeURIComponent(p.name)+'&repo='+encodeURIComponent(p.repo)+'&branch='+encodeURIComponent(p.branch);
}
async function pick(k){
  if(busy)return;
  if(!okRepo||!okTk){toast(!okRepo?'Publish the project to GitHub first':'GitHub is not connected');return}
  busy=true;$('bApk').disabled=true;$('bAab').disabled=true;
  try{
    setSt(k,'go','Checking repo...');
    var info=await gh('GET','/repos/'+p.repo);
    if(info.permissions&&info.permissions.push===false)throw new Error('Your GitHub account cannot write to '+p.repo);
    var cur=await getCur(k);
    if(!isSame(cur,k)){
      setSt(k,'go','Adding '+W[k].file+'...');
      try{
        await gh('PUT','/repos/'+p.repo+'/contents/'+path(k),{message:'Add '+W[k].file,content:b64u(W[k].yml),branch:p.branch,sha:cur?cur.sha:undefined});
      }catch(e){
        if(e.status===404||e.status===403)throw new Error('GitHub refused the workflow file. Sign in again in the GitHub tab so the token has the workflow permission.');
        throw e;
      }
      await sleep(2500);
    }
    setSt(k,'ok','Ready. Opening...');
    await sleep(300);
    go(k);
  }catch(e){
    setSt(k,'bad',(e&&e.message)||'Something went wrong');
    toast((e&&e.message)||'Something went wrong');
    busy=false;$('bApk').disabled=false;$('bAab').disabled=false;
  }
}
$('bApk').onclick=function(){pick('apk')};
$('bAab').onclick=function(){pick('aab')};
$('backBtn').onclick=function(){location.href='/'};
window.addEventListener('pageshow',function(e){if(e.persisted){busy=false;$('bApk').disabled=false;$('bAab').disabled=false;check()}});
check();
})();
</script>
</body>
</html>
