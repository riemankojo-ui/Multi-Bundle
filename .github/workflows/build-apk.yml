name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Copy web files
        run: |
          mkdir -p www
          cp *.html *.js *.css www/ 2>/dev/null || true
          cp manifest.json icon-192.png icon-512.png www/ 2>/dev/null || true
      - run: npx cap add android
      - name: Add phone folder access plugin
        run: |
          D=android/app/src/main/java/com/multibundle/app
          mkdir -p $D
          cp FolderAccessPlugin.java MainActivity.java $D/
      - name: Use the MB icon
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done
      - name: MB splash screen
        continue-on-error: true
        run: |
          for f in $(find android/app/src/main/res -name 'splash*.png'); do
            size=$(identify -format '%wx%h' "$f")
            w=${size%x*}; h=${size#*x}
            m=$(( w < h ? w : h ))
            d=$(( m * 30 / 100 ))
            convert -size ${w}x${h} xc:'#0b0b0f' \( splash-d.png -resize ${d}x${d} \) -gravity center -composite "$f"
          done
          sed -i 's|<item name="android:background">@drawable/splash</item>|&<item name="windowSplashScreenBackground">#0b0b0f</item>|' android/app/src/main/res/values/styles.xml
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MultiBundle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
