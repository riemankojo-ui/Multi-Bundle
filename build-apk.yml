name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Copy web files
        run: |
          mkdir -p www
          cp *.html *.js *.css www/ 2>/dev/null || true
          cp manifest.json icon-192.png icon-512.png www/ 2>/dev/null || true
          rm -f www/capacitor.config.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MultiBundle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk