<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Build APK - Multi Bundle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0c0f;color:#fff;font-family:system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.back{background:none;border:0;color:#9a9ca6;font:800 14px system-ui,sans-serif;padding:0 0 14px;cursor:pointer}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#f01424}
h1{font-size:22px;font-weight:800;margin:2px 0;overflow-wrap:anywhere}
.sub{font-size:12px;color:#9a9ca6;margin-bottom:16px;overflow-wrap:anywhere}
.lbl{font-size:11px;font-weight:800;letter-spacing:1px;color:#9a9ca6}
input{width:100%;background:#101115;color:#fff;border:1px solid #303139;border-radius:10px;padding:12px;font-size:14px;font-family:inherit;outline:0;margin:4px 0 12px}
#msg{font-size:13px;line-height:1.5;margin:4px 0 14px;color:#c9cad1;overflow-wrap:anywhere}
.row{display:flex;gap:8px}
button.b{padding:13px;border-radius:12px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;border:1px solid #303139;background:#20222a;color:#fff}
button.red{background:#f01424;border:0}
a.dl{display:inline-block;margin-top:10px;padding:12px 16px;border-radius:12px;background:#f01424;color:#fff;font-weight:800;text-decoration:none}
a.log{color:#f01424;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <button class="back" id="apkBack">&#8249; Back</button>
  <div class="eyebrow">BUILD APK</div>
  <h1 id="pName">Project</h1>
  <div class="sub" id="pInfo"></div>
  <div id="apkForm">
    <div class="lbl">APP NAME</div><input id="apkName" autocomplete="off">
    <div class="lbl">PACKAGE ID</div><input id="apkId" autocomplete="off" autocapitalize="off">
    <div class="lbl">VERSION</div><input id="apkVer" autocomplete="off">
  </div>
  <div id="msg"></div>
  <div class="row"><button class="b" id="apkClose" style="flex:1">Close</button><button class="b red" id="apkGo" style="flex:2">Build APK</button></div>
</div>
<script>
(function(){
'use strict';
var WF='build-apk.yml',WF_PATH='.github/workflows/'+WF;
var YML=[
'name: Build APK',
'on:',
'  workflow_dispatch:',
'    inputs:',
'      app_name:',
'        description: App name',
'        required: true',
'        default: App',
'      app_id:',
'        description: Package ID',
'        required: true',
'        default: com.example.app',
'      version:',
'        description: Version',
'        required: true',
'        default: 1.0.0',
'permissions:',
'  contents: write',
'jobs:',
'  apk:',
'    runs-on: ubuntu-latest',
'    env:',
'      APP_NAME: ${{ inputs.app_name }}',
'      APP_ID: ${{ inputs.app_id }}',
'      VERSION: ${{ inputs.version }}',
'      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}',
'      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}',
'    steps:',
'      - uses: actions/checkout@v4',
'      - uses: actions/setup-node@v4',
'        with:',
'          node-version: 22',
'      - uses: actions/setup-java@v4',
'        with:',
'          distribution: temurin',
'          java-version: 21',
'      - name: Prepare web files',
'        run: |',
'          mkdir -p "$RUNNER_TEMP/www"',
'          if [ -f package.json ] && grep -q \'"build"\' package.json; then',
'            npm install',
'            npm run build',
'            if [ -d dist ]; then cp -r dist/. "$RUNNER_TEMP/www/"; else cp -r build/. "$RUNNER_TEMP/www/"; fi',
'          else',
'            tar --exclude=.git --exclude=.github -cf - . | tar -xf - -C "$RUNNER_TEMP/www"',
'          fi',
'      - name: Create Android project',
'        run: |',
'          mkdir "$RUNNER_TEMP/cap"',
'          cd "$RUNNER_TEMP/cap"',
'          npm init -y',
'          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8',
'          mv "$RUNNER_TEMP/www" www',
'          npx cap init "$APP_NAME" "$APP_ID" --web-dir www',
'          npx cap add android',
'          if [ -f "$GITHUB_WORKSPACE/FolderAccessPlugin.java" ]; then',
'            PKG_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"',
'            mkdir -p "$PKG_DIR"',
'            sed "s/^package .*/package $APP_ID;/" "$GITHUB_WORKSPACE/FolderAccessPlugin.java" > "$PKG_DIR/FolderAccessPlugin.java"',
'            printf \'%s\\n\' "package $APP_ID;" "" "import android.os.Bundle;" "import com.getcapacitor.BridgeActivity;" "" "public class MainActivity extends BridgeActivity {" "    @Override" "    public void onCreate(Bundle savedInstanceState) {" "        registerPlugin(FolderAccessPlugin.class);" "        super.onCreate(savedInstanceState);" "    }" "}" > "$PKG_DIR/MainActivity.java"',
'          fi',
'          npx cap sync android',
'          sed -i "s/versionName \\".*\\"/versionName \\"$VERSION\\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle',
'      - name: Build debug APK',
'        run: |',
'          cd "$RUNNER_TEMP/cap/android"',
'          chmod +x gradlew',
'          ./gradlew assembleDebug',
'      - name: Publish release',
'        env:',
'          GH_TOKEN: ${{ github.token }}',
'        run: |',
'          cp "$RUNNER_TEMP/cap/android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/app.apk"',
'          gh release create "apk-${{ github.run_number }}" "$RUNNER_TEMP/app.apk" --title "APK build ${{ github.run_number }}" --notes "$APP_NAME $VERSION" --target "$GITHUB_SHA"',
''].join('\n');


function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tk(){try{return localStorage.getItem('mb_gh_active_token')||''}catch(e){return ''}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function b64u(s){return btoa(unescape(encodeURIComponent(s)))}
function fromB64u(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
async function gh(method,path,body){
  var r=await fetch('https://api.github.com'+path,{method:method,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tk(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  var d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){var er=new Error((d&&d.message)||('HTTP '+r.status));er.status=r.status;throw er}
  return d;
}
function defId(repo){
  var pr=(repo||'').split('/');
  var o=(pr[0]||'me').toLowerCase().replace(/[^a-z0-9]/g,'');
  var n=(pr[1]||'app').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!/^[a-z]/.test(o))o='x'+o;
  if(!/^[a-z]/.test(n))n='a'+n;
  return 'com.'+o+'.'+n;
}

var S={stop:false};
function chk(){if(S.stop)throw new Error('stopped')}

async function build(p,v,say){
  var repo=p.githubRepo,br=p.githubBranch||'main';
  say('Checking repo\u2026');
  var info=await gh('GET','/repos/'+repo);
  if(info.permissions&&info.permissions.push===false)throw new Error('Your GitHub account cannot write to '+repo+'.');
  chk();
  var cur=null;
  try{cur=await gh('GET','/repos/'+repo+'/contents/'+WF_PATH+'?ref='+encodeURIComponent(br))}catch(e){if(e.status!==404)throw e}
  var same=false;
  try{same=!!(cur&&cur.content&&fromB64u(cur.content)===YML)}catch(e){}
  if(!same){
    say('Adding build workflow\u2026');
    try{
      await gh('PUT','/repos/'+repo+'/contents/'+WF_PATH,{message:'Add APK build workflow',content:b64u(YML),branch:br,sha:cur?cur.sha:undefined});
    }catch(e){
      if(e.status===404||e.status===403)throw new Error('GitHub refused the workflow file. Sign in again in the GitHub tab so the token has the workflow permission.');
      throw e;
    }
    await sleep(4000);chk();
  }
  var before=0;
  try{
    var r0=await gh('GET','/repos/'+repo+'/actions/workflows/'+WF+'/runs?per_page=5');
    (r0.workflow_runs||[]).forEach(function(r){if(r.id>before)before=r.id});
  }catch(e){}
  say('Starting build\u2026');
  var ok=false,lastErr=null,i;
  for(i=0;i<8&&!ok;i++){
    chk();
    try{
      await gh('POST','/repos/'+repo+'/actions/workflows/'+WF+'/dispatches',{ref:br,inputs:{app_name:v.name,app_id:v.id,version:v.ver}});
      ok=true;
    }catch(e){lastErr=e;if(e.status===404||e.status===422)await sleep(3000);else throw e}
  }
  if(!ok)throw lastErr||new Error('Could not start the build.');
  var run=null;
  for(i=0;i<20&&!run;i++){
    await sleep(3000);chk();
    var rs=await gh('GET','/repos/'+repo+'/actions/workflows/'+WF+'/runs?event=workflow_dispatch&per_page=5');
    run=(rs.workflow_runs||[]).find(function(r){return r.id>before})||null;
  }
  if(!run)throw new Error('The build did not start. Check the Actions tab on GitHub.');
  var t0=Date.now();
  while(true){
    chk();
    run=await gh('GET','/repos/'+repo+'/actions/runs/'+run.id);
    var mins=Math.floor((Date.now()-t0)/60000),secs=Math.floor((Date.now()-t0)/1000)%60;
    if(run.status==='completed')break;
    say((run.status==='queued'?'Waiting for GitHub to start':'Building APK')+'\u2026 '+mins+'m '+secs+'s (first build takes about 5-8 min)');
    if(Date.now()-t0>40*60000)throw new Error('The build is taking too long. Check the Actions tab on GitHub.');
    await sleep(10000);
  }
  if(run.conclusion!=='success')return {fail:true,run:run.html_url,why:run.conclusion};
  var rel=null;
  for(i=0;i<5&&!rel;i++){
    try{rel=await gh('GET','/repos/'+repo+'/releases/tags/apk-'+run.run_number)}catch(e){await sleep(3000)}
  }
  var asset=rel&&(rel.assets||[]).find(function(a){return /\.apk$/i.test(a.name)});
  if(!asset)return {fail:true,run:run.html_url,why:'APK file not found in the release'};
  return {url:asset.browser_download_url,run:run.html_url};
}

var q=new URLSearchParams(location.search);
var p={id:q.get('pid')||'',name:q.get('name')||'App',githubRepo:q.get('repo')||'',githubBranch:q.get('branch')||'main'};
var saved={};try{saved=JSON.parse(localStorage.getItem('mb_apk_'+p.id)||'{}')}catch(e){}
$('pName').textContent=p.name;
$('pInfo').textContent='Repo: '+(p.githubRepo||'-')+' \u00b7 branch: '+p.githubBranch;
$('apkName').value=saved.name||p.name||'App';
$('apkId').value=saved.id||defId(p.githubRepo);
$('apkVer').value=saved.ver||'1.0.0';
var msg=$('msg'),go=$('apkGo'),busy=false;
function say(t){msg.textContent=t}
function leave(){S.stop=true;location.href='/'}
$('apkClose').onclick=leave;
$('apkBack').onclick=function(){if(busy&&!confirm('Stop watching this build? It keeps running on GitHub.'))return;leave()};
if(!p.githubRepo){say('Open this page from the Bundle tab (project must be published to GitHub).');go.disabled=true;go.style.opacity='.5'}
else if(!tk()){say('Connect GitHub first (GitHub tab).');go.disabled=true;go.style.opacity='.5'}
go.onclick=async function(){
  if(busy)return;
  var v={name:$('apkName').value.trim(),id:$('apkId').value.trim(),ver:$('apkVer').value.trim()};
  if(!v.name){say('Enter an app name.');return}
  if(!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(v.id)){say('Package ID must look like com.yourname.app (lowercase letters, numbers, dots).');return}
  if(!/^\d+(\.\d+){0,2}$/.test(v.ver)){say('Version must look like 1.0.0.');return}
  try{localStorage.setItem('mb_apk_'+p.id,JSON.stringify(v))}catch(e){}
  S.stop=false;busy=true;go.disabled=true;go.style.opacity='.5';$('apkForm').style.display='none';
  try{
    var res=await build(p,v,say);
    if(res.fail){
      msg.innerHTML='Build failed ('+esc(res.why)+'). <a class="log" href="'+esc(res.run)+'" target="_blank" rel="noopener">Open the log</a> and send me the red error lines.';
    }else{
      msg.innerHTML='APK is ready.<br><a class="dl" href="'+esc(res.url)+'" target="_blank" rel="noopener">Download APK</a>'+
        '<div style="font-size:12px;color:#9a9ca6;margin-top:10px">Open the file on your phone and allow "install unknown apps" if Android asks. Private repo: stay signed in to GitHub in your browser.</div>';
    }
  }catch(e){
    if(e&&e.message==='stopped')return;
    msg.textContent=(e&&e.message)||'Something went wrong.';
    $('apkForm').style.display='';
  }
  busy=false;go.disabled=false;go.style.opacity='1';go.textContent='Build again';
};
})();
</script>
</body>
</html>
