<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Package - Multi Bundle</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--bg:#0b0c0f;--card:#14151a;--line:#25262d;--mut:#8f919b;--red:#f01424;--green:#2fd27a;--txt:#fff}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}
body{background:radial-gradient(120% 50% at 0% 0%,rgba(240,20,36,.16),transparent 60%),var(--bg);background-attachment:fixed}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:rgba(11,12,15,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.top b{font-size:16px;letter-spacing:.3px}
.top span{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--red)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.pn{font-size:19px;font-weight:800;overflow-wrap:anywhere}
.pr{font-size:12px;color:var(--mut);overflow-wrap:anywhere;margin-top:2px}
.sec{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--mut);margin:4px 2px 10px}
.notice{border:1px solid #5a1a20;background:#2a0f13;color:#ffb3b9;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:14px}
.rw{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.d{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.d.ok{background:var(--green)}.d.x{background:var(--red)}.d.go{background:#ffd166}
.t{flex:1;min-width:0;font-size:14px;font-weight:700}
.t small{display:block;color:var(--mut);font-size:11px;font-weight:600;margin-top:3px}
.t em{font-style:normal;font-size:9px;font-weight:800;letter-spacing:1.5px;color:var(--green);margin-left:8px}
.dl,.lg{flex:none;text-decoration:none;font-size:12px;font-weight:800;border-radius:99px;padding:8px 14px}
.dl{background:var(--red);color:#fff}
.lg{border:1px solid #2c2d35;background:#1b1c22;color:#c9cad1}
.dl:active,.lg:active{opacity:.7}
.empty{padding:18px 0;text-align:center;color:var(--mut);font-size:13px}
.rf{display:block;margin:0 auto;border:0;background:none;color:var(--mut);font:700 12px system-ui,sans-serif;padding:10px;cursor:pointer}
.rf:active{color:var(--red)}
</style>
</head>
<body>
<div class="top"><button id="backBtn" aria-label="Back">&#8249;</button><b>Package</b><span>ANDROID</span></div>

<section class="wrap">
  <div class="card"><div class="pn" id="pName">Project</div><div class="pr" id="pRepo"></div></div>
  <div class="notice" id="notice" hidden></div>
  <div class="sec">LATEST RUNS</div>
  <div class="card" id="list" style="padding:4px 14px"></div>
  <button class="rf" id="rf" type="button">Refresh</button>
</section>

<script>
(function(){
'use strict';
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function enc(s){return encodeURIComponent(s||'')}
function tk(){try{return sessionStorage.getItem('mb_apk_tk')||localStorage.getItem('mb_apk_tk')||localStorage.getItem('mb_gh_active_token')||''}catch(e){return ''}}
async function gh(path){
  var r=await fetch('https://api.github.com'+path,{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tk()}});
  var d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){var er=new Error((d&&d.message)||('HTTP '+r.status));er.status=r.status;throw er}
  return d;
}
var q=new URLSearchParams(location.search);
var p={id:q.get('pid')||'',name:q.get('name')||'App',githubRepo:q.get('repo')||'',githubBranch:q.get('branch')||'main'};
var WF=q.get('wf')||'build-apk.yml';
var KH='mb_apk_hist_'+p.id;
function fmt(t){try{return new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function sz(n){return n?(n/1048576).toFixed(1)+' MB':''}
function verOf(rel){var m=/(\d+(?:\.\d+){0,2})\s*$/.exec((rel&&rel.body)||'');return m?m[1]:''}
function localRows(){
  var l=[];try{l=JSON.parse(localStorage.getItem(KH)||'[]')}catch(e){}
  return l.map(function(h){return {n:0,st:h.ok?'ok':'x',t:h.t,ver:h.ver,size:0,url:h.ok?h.url:'',log:h.run}});
}
$('pName').textContent=p.name;
$('pRepo').textContent=p.githubRepo||'No GitHub repo';
$('backBtn').onclick=function(){location.href='apkbuild.html?pid='+enc(p.id)+'&name='+enc(p.name)+'&repo='+enc(p.githubRepo)+'&branch='+enc(p.githubBranch)};

function draw(rows){
  var box=$('list');
  if(!rows.length){box.innerHTML='<div class="empty">No builds yet.</div>';return}
  var first=-1;rows.forEach(function(r,i){if(first<0&&r.url)first=i});
  box.innerHTML=rows.map(function(r,i){
    var title='APK build'+(r.n?' '+r.n:'')+(r.ver?' \u00b7 v'+r.ver:'');
    var word=r.st==='go'?'Building':(r.st==='ok'?'Ready':'Failed');
    var sub=[word,fmt(r.t),sz(r.size)].filter(Boolean).join(' \u00b7 ');
    var act=r.url?'<a class="dl" href="'+esc(r.url)+'" target="_blank" rel="noopener">Download</a>':(r.log?'<a class="lg" href="'+esc(r.log)+'" target="_blank" rel="noopener">Log</a>':'');
    return '<div class="rw"><span class="d '+r.st+'"></span><div class="t">'+esc(title)+(i===first?'<em>LATEST</em>':'')+'<small>'+esc(sub)+'</small></div>'+act+'</div>';
  }).join('');
}
async function load(){
  var n=$('notice');n.hidden=true;
  $('list').innerHTML='<div class="empty">Loading...</div>';
  var rows=[];
  if(p.githubRepo&&tk()){
    try{
      var res=await Promise.all([
        gh('/repos/'+p.githubRepo+'/actions/workflows/'+WF+'/runs?per_page=10'),
        gh('/repos/'+p.githubRepo+'/releases?per_page=30')
      ]);
      var rel={};(res[1]||[]).forEach(function(r){rel[r.tag_name]=r});
      (res[0].workflow_runs||[]).forEach(function(r){
        var rl=rel['apk-'+r.run_number];
        var a=rl&&(rl.assets||[]).find(function(x){return /\.apk$/i.test(x.name)});
        rows.push({n:r.run_number,st:r.status!=='completed'?'go':(r.conclusion==='success'?'ok':'x'),t:r.created_at,ver:verOf(rl),size:a?a.size:0,url:a?a.browser_download_url:'',log:r.html_url});
      });
    }catch(e){
      n.hidden=false;n.textContent='Could not load from GitHub ('+((e&&e.message)||'error')+'). Showing builds saved on this phone.';
    }
  }else{
    n.hidden=false;n.textContent=!p.githubRepo?'No GitHub repo linked. Showing builds saved on this phone.':'GitHub is not connected. Showing builds saved on this phone.';
  }
  if(!rows.length)rows=localRows();
  draw(rows);
}
$('rf').onclick=load;
load();
})();
</script>
</body>
</html>
